<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <nav class="navbar">
        <!-- Cart icon + count badge are pinned to the right edge of
             the navbar via .navbar-center { justify-content: flex-end }
             in styles/main.css. -->
        <div class="navbar-center">
            <div class="cart-btn">
                <span class="nav-icon">
                    <i class="fas fa-shopping-cart"></i>
                </span>
                <div class="cart-items">0</div>
            </div>
        </div>
    </nav>

    <section class="products">
        <div class="section-title">
            <h2>Products</h2>
        </div>
        <div class="products-center"></div>
    </section>

    <div class="cart-overlay">
        <div class="cart">
            <span class="close-cart">
                <i class="fas fa-times"></i>
            </span>
            <h2>Shopping Cart</h2>
            <div class="cart-content">
                <div class="cart-item">
                    <img src="./images/product-1.jpg" alt="First Product">
                    <div>
                        <h4>First Product</h4>
                        <h5>$89</h5>
                        <span class="remove-item">Delete</span>
                    </div>
                    <div class="cart-item-amount">
                        <i class="fas fa-chevron-up"></i>
                        <p class="item-amount">1</p>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>

            <div class="cart-footer">
                <h3>Total Price: $<span class="cart-total">0</span></h3>
                <button class="clear-cart btn">Delete Products</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
